name: Room Finder Scraper

on:
  schedule:
    # Runs every 15 minutes. 
    - cron: '*/15 * * * *'
  workflow_dispatch: # This allows you to run it manually from a button

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 cloudscraper

      - name: Run scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python room_finder.py

      - name: Save new links to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_links.txt
          git commit -m "Updated seen links" || echo "No new links to save"
          git push

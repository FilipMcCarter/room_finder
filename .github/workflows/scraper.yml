name: Room Finder Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: room-finder
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 cloudscraper

      - name: Run scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python room_finder.py

      - name: Save new links to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add seen_links.txt

          # Only commit and push if there are actual changes
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Updated seen links"

            # Sync with remote to avoid push rejection
            git pull --rebase origin main

            git push
          else
            echo "No new links to save"
          fi
